name: release

# Every push to main updates the release PR (version.txt and CHANGELOG.md).
# Merging it creates the tag and the GitHub release, then build-apk attaches
# one signed APK per ABI to that release.
on:
  push:
    branches: [main]
  # Rebuild the APKs of an existing tag, e.g. when build-apk failed after
  # release-please had already created the tag.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and attach the APKs to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - id: resolve_tag
        env:
          TAG: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}

      - name: Check version.txt matches the tag
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          test "$(cat version.txt)" = "${TAG#v}" || {
            echo "::error::version.txt is $(cat version.txt), the tag is $TAG"
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Fail instead of falling back to the debug key. An APK signed with a
      # different key can't update the installed app.
      - name: Restore the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, see the Releases section in README.md"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore.jks
          cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore.jks
          EOF

      - run: ./gradlew assembleRelease

      # Keep the full ABI string in the name. The in-app updater picks its
      # asset with name.contains(<device abi>).
      - name: Name the APKs
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$f" -release.apk)"
            mv "$f" "dist/tvhome-${TAG#v}-${abi#app-}.apk"
          done
          ls -l dist

      - name: Attach the APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: gh release upload "$TAG" dist/*.apk --clobber
